  transport: in-process
  optional_http_server_required: false
  methods:
    - forward
    - decision_logits
    - predict
  question_types:
    - noul
    - choice
    - score
  option_order: caller candidate order after stable presented-slot mapping
  probability_rule: masked softmax over presented decision-token logits

model_representation:
  default: calibrated_probability_distribution
  preserved_fields:
    - raw_logits
    - raw_probability_distribution
    - calibrated_probability_distribution
    - option_id_probability_mapping
    - presented_slot_mapping
  calibration:
    method: identity_after_official_masked_softmax
    posthoc_temperature: null
    note: The release publishes no post-hoc temperature or separate calibration transform. For the common WS1 schema, calibrated_probability_distribution is therefore identical to the official masked-softmax distribution. Calibration must be measured or refit on the routing dataset rather than inferred from the model-card adjective.

