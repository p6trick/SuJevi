model_key: laya
display_name: Laya
modality:
  - text

source:
  paper: null
  paper_status: No first-party Laya methods paper was identified as of 2026-11-06.
  code_repository: https://github.com/NandhaKishorM/laya.git
  code_release: v0.4.24
  code_revision: 9d3fcc8924ef47b71510f77e19659f97ade0eec4
  checkpoint_repository: convaiinnovations/laya
  checkpoint_revision: 7b928d828b7b0e022f929d9bd2e44165aa270148
  base_model_repository: answerdotai/ModernBERT-large

architecture:
  family: non-autoregressive typed decision encoder
  backbone: ModernBERT-large
  parameters: 421293830
  context_tokens: 512
  head_context_tokens: 192
  decision_head: two transformer layers plus option-marker scorer and act head
  option_layout: sequential
  checkpoint_weight_dtype: float16
  cuda_autocast_dtype: bfloat16
  quantized: false

native_interface:
  implementation: official laya.load / laya.Agent
  transport: in-process
  optional_http_server_required: false
  question_types:
    - noul
    - choice
    - score
  option_order:
    noul:
      - "false"
      - "true"
    choice: request criteria insertion order
    score: request criteria index order
  calibration:
    method: temperature scaling by question type and option-count bucket
    temperature:
      choice: 1.6369030475616455
      score: 1.2514300346374512
      noul: 1.983399510383606
    temperature_by_options:
      "choice:2": 1.9063563346862793
      "choice:3-5": 1.7601518630981445
      "choice:6-10": 1.0000158548355103
      "choice:11+": 0.10058280825614929
      "score:3-5": 1.2514300346374512
      "noul:2": 1.983399510383606
    runtime_clamp: [0.5, 5.0]
    known_issue: The shipped choice:11+ value is below the runtime floor and is applied as 0.5 with a warning. Validate option counts above 10 separately.

model_representation:
  default: calibrated_probability_distribution
  preserved_fields:
    - raw_logits
    - raw_probability_distribution
    - calibrated_probability_distribution
    - option_id_probability_mapping
  notes:
    raw_logits: Extracted before temperature scaling from the official Agent forward path.
    raw_probability_distribution: Softmax of the raw option logits.
    calibrated_probability_distribution: Softmax after the official per-type or per-option-count temperature.
    public_precision: The normal predict response rounds probabilities to four decimals; the SuJevi runtime will preserve full-precision arrays before native response formatting.
    calibration_limit: The model card reports that the released checkpoint is over-confident and recommends refitting temperatures on domain data.

fine_tuning:
  official_training_script: true
  cli: laya-train
  python_api: laya.train.finetune
  objectives:
    - rlcd
    - soft-ce
  full_encoder_training: true
  head_only_training: true
  calibration_after_training: true
  current_stage_execution: not_run

local_artifacts:
  huggingface_home: models/huggingface
  checkpoint_snapshot: models/huggingface/hub/models--convaiinnovations--laya/snapshots/7b928d828b7b0e022f929d9bd2e44165aa270148

